# --- JWT ---
# Must be at least 32 bytes (256 bits) for HS256. Generate your own before
# using this anywhere beyond localhost, e.g.: openssl rand -base64 32
jwt.secret=L3BpPexIHN07WPcE/E5x3DP7M9g/Vm6aq8HISqpfdPQ=
jwt.expiration-ms=86400000

# --- Face encoding encryption ---
# AES key, must be exactly 16 characters (AES-128) for this scaffold's
# simple implementation. Generate a random one for real use.
encryption.secret-key=ChangeThisKey16!

# --- Geofencing ---
# Set to your actual campus coordinates. Attendance recognized outside this
# radius will be rejected. Get real coordinates from Google Maps.
geofence.campus-latitude=28.684273
geofence.campus-longitude=77.505357
geofence.allowed-radius-meters=400
geofence.enabled=false

# --- Email alerts ---
# Configure with real SMTP credentials (e.g. Gmail app password) before
# email features will actually send anything.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
attendance.low-attendance-threshold=75
attendance.alerts-enabled=false
